[package]
name = "rubik"
version = "0.1.0"
edition = "2024"
description = "3x3x3 and 4x4x4 Rubik's cube engine with bandaging support and an algorithm search engine"

[lib]
name = "rubik"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables the Python bindings (used by maturin, see pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
rayon = "1.12"
pyo3 = { version = "0.30", optional = true, features = ["abi3-py39"] }

[profile.release]
opt-level = 3
# "fat" was measured 10-40% slower than "thin" on benches/engine.rs.
lto = "thin"
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support", "rayon"] }

[[bench]]
name = "engine"
harness = false
